[workspace]
resolver = "3"
members = ["crates/posta"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/posta"

[workspace.dependencies]
axum = "0.8"
http-body-util = "0.1"
keel = { version = "0", registry = "perish" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
